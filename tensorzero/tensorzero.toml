[gateway]
bind_address = "0.0.0.0:3000"

# Groq only (free tier: ~8,000 tokens/min and 1,000 requests/day per model, so keep input + max_tokens
# of a single call well under 8,000). Tried in order; the next one is used when a model errors or hits its rate limit.
# Model ids change over time — list the ones your key can use: GET https://api.groq.com/openai/v1/models
# To use OpenAI again: add a provider with type = "openai", model_name = "gpt-4o-mini" and put it first in routing.
[models.research_model]
# Qwen is NOT a fallback here: Groq's free tier caps it at 1,000 output tokens per minute and rejects any request
# whose max_tokens is larger, which is every research function (plan 1200 ... report_write 3500).
routing = ["groq_gpt_oss_120b", "groq_gpt_oss_20b"]

[models.research_model.providers.groq_gpt_oss_120b]
type = "groq"
model_name = "openai/gpt-oss-120b"

[models.research_model.providers.groq_gpt_oss_20b]
type = "groq"
model_name = "openai/gpt-oss-20b"

# Benchmark runs pin the "strict" variants below: gpt-oss-120b only, no fallback, so every benchmarked report is
# written by the same model. When its daily token limit is reached the call fails and the runner waits for the
# next day instead of silently mixing in gpt-oss-20b. Normal research keeps the fallback (variant "primary").
[models.research_model_strict]
routing = ["groq_gpt_oss_120b"]

[models.research_model_strict.providers.groq_gpt_oss_120b]
type = "groq"
model_name = "openai/gpt-oss-120b"

# Two judges from different model families, averaged (app/bench.py, eval.py uses judge A). Reports are written by
# gpt-oss-120b; judge A is Qwen only (no fallback, so it never silently becomes a gpt-oss judge - rate limits are
# waited out instead). Judge B is gpt-oss: since every benchmarked system writes with the same model, any
# self-preference applies to all systems equally and doesn't skew the comparison.
# Step 3 critic panel: the skeptic deliberately uses another model family than the fact-checker (gpt-oss-120b).
# Qwen first; gpt-oss-20b when Qwen is rate-limited (still a different model from the fact-checker).
[models.skeptic_model]
routing = ["groq_qwen", "groq_gpt_oss_20b"]

[models.skeptic_model.providers.groq_qwen]
type = "groq"
model_name = "qwen/qwen3.8-27b"

[models.skeptic_model.providers.groq_gpt_oss_20b]
type = "groq"
model_name = "openai/gpt-oss-20b"

# Step 4c writer variant B: gpt-oss-20b only (no silent switch to 120b), so the bandit compares what it thinks it does
[models.writer_20b_model]
routing = ["groq_gpt_oss_20b"]

[models.writer_20b_model.providers.groq_gpt_oss_20b]
type = "groq"
model_name = "openai/gpt-oss-20b"

[models.judge_model]
routing = ["groq_qwen"]

[models.judge_model.providers.groq_qwen]
type = "groq"
model_name = "qwen/qwen3.8-27b"

[models.judge_alt_model]
routing = ["groq_gpt_oss_20b"]   # not 120b: that daily quota is reserved for the writer

[models.judge_alt_model.providers.groq_gpt_oss_20b]
type = "groq"
model_name = "openai/gpt-oss-20b"


[functions.research_summarize]
type = "chat"

[functions.research_summarize.variants.primary]
type = "chat_completion"
model = "research_model"
weight = 1.0
temperature = 0.3
max_tokens = 2000
system_template = "templates/research_summarize_system.minijinja"

[functions.research_summarize.variants.strict]
type = "chat_completion"
model = "research_model_strict"
weight = 0.0
